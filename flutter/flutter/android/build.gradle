group = "com.arthenica.ffmpegkit.flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// Define AAR download
def aarUrl = 'http://[::]:8000/ffmpeg-kit-full-gpl-6.0.aar'
def aarFile = file('libs/ffmpeg-kit-full-gpl-6.0.aar')

tasks.register('downloadAar') {
    doLast {
        if (!aarFile.exists()) {
            println "Downloading AAR from $aarUrl"
            new URL(aarUrl).withInputStream { i ->
                aarFile.parentFile.mkdirs()
                aarFile.withOutputStream { it << i }
            }
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == 'assemble' || it.name.startsWith("assemble") }.all {
        dependsOn(downloadAar)
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs' // Looks for local .aar files here
    }
}

android {
    namespace = "com.arthenica.ffmpegkit.flutter"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        versionCode 603
        versionName "6.0.3"
    }
}

dependencies {
    implementation("androidx.annotation:annotation:1.9.1")
    implementation(name: "ffmpeg-kit-full-gpl-6.0", ext: "aar")
}