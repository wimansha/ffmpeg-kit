group = "com.arthenica.ffmpegkit.flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def aarUrl = 'http://[::]:8000/ffmpeg-kit-audio-6.0-2.LTS.aar'
//def aarFile = file("$projectDir/libs/ffmpeg-kit-audio-6.0-2.LTS.0.aar")
def aarFile = file("$rootDir/app/libs/ffmpeg-kit-audio-6.0-2.LTS.0.aar")

// Download the AAR during configuration
if (!aarFile.exists()) {
    println "Downloading AAR from $aarUrl..."
    try {
        new URL(aarUrl).withInputStream { i ->
            aarFile.parentFile.mkdirs()
            aarFile.withOutputStream { it << i }
        }
        println "Downloaded AAR to: ${aarFile.absolutePath}"
    } catch (Exception e) {
        println "Failed to download AAR: $e"
    }
}

def smartExceptionJarUrl = 'http://[::]:8000/smart-exception-java-0.2.1.jar'
def smartExceptionJarFile = file("$rootDir/app/libs/smart-exception-java-0.2.1.jar")

// Download the AAR during configuration
if (!aarFile.exists()) {
    println "Downloading smartExceptionJar from $smartExceptionJarUrl..."
    try {
        new URL(smartExceptionJarUrl).withInputStream { i ->
            smartExceptionJarFile.parentFile.mkdirs()
            smartExceptionJarFile.withOutputStream { it << i }
        }
        println "Downloaded smartExceptionJar to: ${smartExceptionJarFile.absolutePath}"
    } catch (Exception e) {
        println "Failed to download smartExceptionJar: $e"
    }
}

android {
    namespace = "com.arthenica.ffmpegkit.flutter"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        versionCode 603
        versionName "6.0.3"
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs "${rootDir}/app/libs"
    }
}

dependencies {
    implementation("androidx.annotation:annotation:1.9.1")
    implementation(name: "ffmpeg-kit-audio-6.0-2.LTS", ext: "aar")
    implementation(name: "smart-exception-java-0.2.1", ext: "jar")
}
