group = "com.arthenica.ffmpegkit.flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// Define AAR download
def aarUrl = 'http://[::]:8000/ffmpeg-kit-full-gpl-6.0.aar'
def aarFile = file('android/libs/ffmpeg-kit-full-gpl-6.0.aar')

// Create 'libs' folder if it doesn't exist
task createLibsDir {
    doLast {
        file('android/libs').mkdirs()
    }
}

// Download AAR file if not present
tasks.register('downloadAar') {
    doLast {
        println "Checking if AAR exists at: ${aarFile.absolutePath}"
        if (!aarFile.exists()) {
            println "Downloading AAR from $aarUrl"
            new URL(aarUrl).withInputStream { i ->
                aarFile.parentFile.mkdirs()
                aarFile.withOutputStream { it << i }
            }
            println "Downloaded AAR to: ${aarFile.absolutePath}"
        } else {
            println "AAR already exists at: ${aarFile.absolutePath}"
        }
    }
}

// Ensure the AAR is downloaded before the build
preBuild.dependsOn(createLibsDir, downloadAar)

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'android/libs' // Looks for local .aar files here
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.arthenica.ffmpegkit.flutter"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        versionCode 603
        versionName "6.0.3"
    }
}

dependencies {
    implementation("androidx.annotation:annotation:1.9.1")
    implementation(name: "ffmpeg-kit-full-gpl-6.0", ext: "aar")
}
