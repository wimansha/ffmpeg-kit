group = "com.arthenica.ffmpegkit.flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def filesToDownload = [
    [url: 'http://[::]:8000/ffmpeg-kit-audio-6.0-2.LTS.aar', file: "$rootDir/app/libs/ffmpeg-kit-audio-6.0-2.LTS.aar"],
    [url: 'http://[::]:8000/smart-exception-java-0.2.1.jar', file: "$rootDir/app/libs/smart-exception-java-0.2.1.jar"],
    [url: 'http://[::]:8000/smart-exception-common-0.2.1.jar', file: "$rootDir/app/libs/smart-exception-common-0.2.1.jar"]
]

// Download files during configuration
filesToDownload.each { item ->
    def fileUrl = item.url
    def file = file(item.file)

    if (!file.exists()) {
        println "Downloading file from $fileUrl..."
        try {
            new URL(fileUrl).withInputStream { i ->
                file.parentFile.mkdirs()
                file.withOutputStream { it << i }
            }
            println "Downloaded file to: ${file.absolutePath}"
        } catch (Exception e) {
            println "Failed to download file: $e"
        }
    }
}

android {
    namespace = "com.arthenica.ffmpegkit.flutter"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        versionCode 603
        versionName "6.0.3"
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs "${rootDir}/app/libs"
    }
}

dependencies {
    implementation("androidx.annotation:annotation:1.9.1")
    implementation(name: "ffmpeg-kit-audio-6.0-2.LTS", ext: "aar")
    implementation(name: "smart-exception-java-0.2.1", ext: "jar")
    implementation(name: "smart-exception-common-0.2.1", ext: "jar")
}