group = "com.arthenica.ffmpegkit.flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def aarUrl = 'http://[::]:8000/ffmpeg-kit-full-gpl-6.0.aar'
def aarFile = file("$projectDir/libs/ffmpeg-kit-full-gpl-6.0.aar")

// Download the AAR during configuration
if (!aarFile.exists()) {
    println "Downloading AAR from $aarUrl..."
    try {
        new URL(aarUrl).withInputStream { i ->
            aarFile.parentFile.mkdirs()
            aarFile.withOutputStream { it << i }
        }
        println "Downloaded AAR to: ${aarFile.absolutePath}"
    } catch (Exception e) {
        println "Failed to download AAR: $e"
    }
}

android {
    namespace = "com.arthenica.ffmpegkit.flutter"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        versionCode 603
        versionName "6.0.3"
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs' // Use local AARs from libs/
    }
}

dependencies {
    implementation("androidx.annotation:annotation:1.9.1")
    implementation(name: "ffmpeg-kit-full-gpl-6.0", ext: "aar")
}
